<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Teklif</title>
<style>
  :root {
    --zemin: #FBFBFA; --kart: #FFFFFF; --halka: #ECECE9; --cizgi: #E5E5EA; --girdi: #D2D2D7;
    --metin: #1D1D1F; --metin2: #3A3A3C; --ikincil: #6E6E73; --mavi: #0A66C2; --yesil: #15803D;
    --kirmizi: #D70015; --marka: #E5341B; --markaZemin: #FDECEA; --turuncu: #B25000; --turuncuZemin: #FFF6EB;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--zemin); color: var(--metin);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; }
  a { color: var(--mavi); text-decoration: none; }
  button { font: inherit; cursor: pointer; }
  .ust { position: sticky; top: 0; z-index: 2; height: 52px; display: flex; align-items: center; padding: 0 16px;
    background: rgba(255,255,255,0.92); backdrop-filter: saturate(180%) blur(12px); border-bottom: 1px solid var(--cizgi); }
  .ust b { font-size: 15px; }
  .ust button { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; border: 0; background: none;
    color: var(--mavi); font-size: 13px; padding: 8px 0; }
  main { max-width: 680px; margin: 0 auto; padding: 20px 16px 40px; display: flex; flex-direction: column; gap: 16px; }
  .kas { font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--marka); text-transform: uppercase; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
  h2 { margin: 0; font-size: 17px; font-weight: 700; }
  .meta { font-size: 13px; color: var(--ikincil); }
  .kart { background: var(--kart); border-radius: 14px; box-shadow: 0 0 0 1px var(--halka); }
  .ic { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .toplam { font-size: 32px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .satir { display: flex; font-size: 13px; color: var(--ikincil); font-variant-numeric: tabular-nums; }
  .satir span:last-child { margin-left: auto; }
  .sure { margin-left: auto; font-size: 13px; font-weight: 600; color: var(--turuncu); }
  p.ozet { margin: 0; font-size: 15px; line-height: 1.5; }
  ul.liste { list-style: none; margin: 0; padding: 0; }
  .sis { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--cizgi); }
  .sis .ik { width: 30px; height: 30px; border-radius: 8px; background: var(--markaZemin); flex: none;
    display: flex; align-items: center; justify-content: center; }
  .sis .ad { display: flex; font-size: 15px; font-weight: 600; gap: 8px; }
  .sis .ad span:last-child { margin-left: auto; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .sis .ks { font-size: 13px; color: var(--ikincil); line-height: 1.4; margin-top: 2px; }
  .kalem { display: flex; gap: 10px; padding: 8px 0 8px 42px; border-top: 1px solid var(--cizgi); font-size: 13px; }
  .kalem .k1 { flex: 1; min-width: 0; }
  .kalem .k1 b { font-weight: 500; font-size: 14px; display: block; }
  .kalem .k1 span { color: var(--ikincil); }
  .kalem .k2 { white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 600; }
  .bag { display: block; padding: 12px 0; border-top: 1px solid var(--cizgi); font-size: 15px; background: none; border-left: 0; border-right: 0; border-bottom: 0; color: var(--mavi); text-align: left; width: 100%; }
  .uy-k { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--turuncu); padding: 8px 0 2px; }
  .madde { font-size: 15px; line-height: 1.45; padding: 6px 0; }
  .alt-b { font-size: 13px; font-weight: 600; color: var(--metin2); padding-top: 10px; }
  label.alan { display: flex; flex-direction: column; gap: 6px; }
  label.alan span { font-size: 13px; font-weight: 600; color: var(--metin2); }
  label.alan span i { font-style: normal; font-weight: 400; color: var(--ikincil); }
  input[type=text], textarea { width: 100%; height: 44px; padding: 0 12px; border: 1px solid var(--girdi); border-radius: 10px;
    font: inherit; font-size: 17px; color: var(--metin); background: #fff; outline: none; }
  textarea { height: 96px; padding: 10px 12px; resize: vertical; line-height: 1.4; }
  input[type=text]:focus, textarea:focus { border-color: var(--mavi); box-shadow: 0 0 0 3px rgba(10,102,194,.15); }
  .kutu { display: flex; gap: 10px; font-size: 15px; line-height: 1.4; align-items: flex-start; cursor: pointer; }
  .kutu input { width: 22px; height: 22px; margin: 0; accent-color: var(--mavi); flex: none; }
  .d-ana { height: 50px; border: 0; border-radius: 12px; background: var(--yesil); color: #fff; font-size: 17px; font-weight: 600; width: 100%; }
  .d-ana.mavi { background: var(--mavi); }
  .d-ana.kirmizi { background: var(--kirmizi); }
  .d-ana:disabled { opacity: .45; cursor: default; }
  .ikili { display: flex; gap: 10px; }
  .ikili button { flex: 1; height: 44px; border: 0; border-radius: 12px; background: #fff; font-size: 15px; font-weight: 600; }
  .d-ikincil { box-shadow: 0 0 0 1px var(--girdi); color: var(--metin); }
  .d-ret { box-shadow: 0 0 0 1px #F2C4C8; color: var(--kirmizi); }
  .dip { font-size: 12px; color: var(--ikincil); line-height: 1.45; }
  .hata { font-size: 13px; color: var(--kirmizi); }
  .gizli { display: none !important; }
  .sonuc { padding: 40px 8px 0; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
  .sonuc .ik { width: 64px; height: 64px; border-radius: 32px; display: flex; align-items: center; justify-content: center; }
  .sonuc h1 { font-size: 24px; }
  .sonuc p { margin: 0; font-size: 15px; line-height: 1.5; color: var(--ikincil); }
  .bekle { padding: 80px 0; text-align: center; color: var(--ikincil); font-size: 15px; }
  .iletisim { font-size: 12px; color: var(--ikincil); line-height: 1.5; padding: 0 4px; }
  @media (min-width: 720px) { main { padding-top: 32px; } h1 { font-size: 30px; } }
  @media print {
    .ust, #onayKarti, .bag, .ikili { display: none !important; }
    .kart { box-shadow: none; border: 1px solid var(--cizgi); }
    .gizli-yazdir-ac { display: block !important; }
    body { background: #fff; }
  }
</style>
</head>
<body>
<header class="ust">
  <b id="sirket">Teklif</b>
  <button type="button" id="yazdir" class="gizli" aria-label="PDF olarak kaydet veya yazdır">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4M12 11v6M9 14l3 3 3-3"/></svg>
    PDF olarak kaydet
  </button>
</header>
<main id="sayfa"><div class="bekle">Teklif yükleniyor…</div></main>

<script>
(() => {
  const SUPABASE = "https://igisxxlsixjeplirxtsp.supabase.co";
  // Yayınlanabilir anahtar: yalnızca kodla erişilen iki fonksiyonu çağırabilir.
  const ANAHTAR = "sb_publishable_9-t40KkzUznQNXw0RWRU8g_3_lvnhE3";

  const kod = (() => {
    const q = new URLSearchParams(location.search).get("t");
    if (q) return q;
    const m = location.pathname.match(/\/t\/([A-Za-z0-9-]{6,})/);
    if (m) return m[1];
    return location.hash.replace(/^#/, "") || "";
  })().toUpperCase();

  const sayfa = document.getElementById("sayfa");
  const e = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  async function rpc(ad, govde) {
    const r = await fetch(`${SUPABASE}/rest/v1/rpc/${ad}`, {
      method: "POST",
      headers: { "apikey": ANAHTAR, "Content-Type": "application/json" },
      body: JSON.stringify(govde)
    });
    const j = await r.json().catch(() => null);
    if (!r.ok) throw new Error((j && j.message) || "Bağlantı kurulamadı. Lütfen tekrar deneyin.");
    return j;
  }

  const para = (v, d) => {
    try { return new Intl.NumberFormat("tr-TR", { style: "currency", currency: d === "TRY" ? "TRY" : d, minimumFractionDigits: 2 }).format(v); }
    catch { return Number(v).toLocaleString("tr-TR", { minimumFractionDigits: 2 }) + " " + d; }
  };
  const tarih = iso => {
    if (!iso) return "";
    const [y, a, g] = iso.slice(0, 10).split("-").map(Number);
    return new Date(y, a - 1, g).toLocaleDateString("tr-TR", { day: "numeric", month: "long", year: "numeric" });
  };
  const sayi = v => Number(v).toLocaleString("tr-TR", { maximumFractionDigits: 2 });

  const IKON = {
    alev: '<path d="M12 3c3 4 6 6 6 11a6 6 0 0 1-12 0c0-3 2-5 3-7 1 2 2 3 3 3 0-3-1-5 0-7z"/>',
    proje: '<path d="M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6"/>',
    servis: '<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/>',
    kamera: '<path d="M3 7h13v10H3zM16 10l5-3v10l-5-3"/>',
    kilit: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
    ses: '<path d="M4 10v4h4l5 4V6L8 10z"/><path d="M16 9a4 4 0 0 1 0 6"/>',
    kutu: '<path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/>',
    uyari: '<path d="M12 4 2 20h20z"/><path d="M12 10v4M12 17v.5"/>',
    onay: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
    geri: '<path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>',
    kapat: '<path d="M6 6l12 12M18 6 6 18"/>'
  };
  const ikon = (ad, boy, renk, kal = 1.7) =>
    `<svg width="${boy}" height="${boy}" viewBox="0 0 24 24" fill="none" stroke="${renk}" stroke-width="${kal}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IKON[ad] || IKON.kutu}</svg>`;

  function hataGoster(mesaj) {
    sayfa.innerHTML = `<div class="sonuc"><span class="ik" style="background:#F2F3F5">${ikon("uyari", 30, "#6E6E73", 1.8)}</span>
      <h1>Teklif açılamadı</h1><p>${e(mesaj)}</p>
      <p>Bağlantıyı e-postadaki düğmeden açtığınızdan emin olun veya teklifi gönderen kişiyle iletişime geçin.</p></div>`;
  }

  function sonucEkrani(v, y) {
    const tur = y.tur;
    const renk = tur === "accepted" ? ["#E5F1EA", "#15803D", "onay"] : tur === "rejected" ? ["#FDECEA", "#D70015", "kapat"] : ["#E6F0F9", "#0A66C2", "geri"];
    const baslik = tur === "accepted" ? "Teklifi onayladınız" : tur === "rejected" ? "Teklifi reddettiniz" : "Revizyon isteğiniz iletildi";
    const sirada = tur === "accepted"
      ? `${e(v.hazirlayan || "Teklifi hazırlayan kişi")} sipariş ve planlama için sizinle iletişime geçecek.`
      : tur === "rejected" ? "Geri bildiriminiz için teşekkür ederiz." : `${e(v.hazirlayan || "Teklifi hazırlayan kişi")} isteğinize göre revize teklifi size iletecek.`;
    sayfa.innerHTML = `<div class="sonuc">
      <span class="ik" style="background:${renk[0]}">${ikon(renk[2], 32, renk[1], 2)}</span>
      <h1>${baslik}</h1>
      <p>${e(v.no)} · ${e(v.konu)}<br>${e(y.zaman || "")}${y.ad ? " · " + e(y.ad) : ""}${y.unvan ? ", " + e(y.unvan) : ""}</p>
      <section class="kart ic" style="width:100%; text-align:left">
        <span class="meta">Sırada ne var?</span>
        <span style="font-size:15px; line-height:1.45">${sirada}</span>
      </section>
      ${iletisim(v)}</div>`;
  }

  const iletisim = v => {
    const s = v.sirket || {};
    const kisi = [v.hazirlayan, v.hazirlayan_telefon, v.hazirlayan_eposta].filter(Boolean).map(e).join(" · ");
    return `<div class="iletisim" style="text-align:left; width:100%">${e(s.unvan || s.kisa || "")}${s.eposta ? " · " + e(s.eposta) : ""}${kisi ? "<br>Sorular için " + kisi : ""}</div>`;
  };

  function ciz(v) {
    document.title = `${v.no} · ${v.konu}`;
    const s = v.sirket || {};
    document.getElementById("sirket").textContent = s.kisa || s.unvan || "Teklif";
    document.getElementById("yazdir").classList.remove("gizli");

    if (v.yanit && v.durum !== "sent") return sonucEkrani(v, v.yanit);

    const d = v.doviz;
    const iskonto = Math.round(v.ara_toplam * v.iskonto_orani) / 100;
    const kdv = v.genel_toplam - (v.ara_toplam - iskonto);
    const musteri = (v.musteri && (v.musteri.ad || v.musteri.unvan)) || "";
    const sure = v.suresi_doldu ? "Süresi doldu" : (v.kalan_gun != null ? `${v.kalan_gun} gün geçerli` : "");

    const sistemler = (v.sistemler || []).map((st, i) => {
      const kalemler = (st.kalemler || []).map(k => `
        <li class="kalem"><span class="k1"><b>${e(k.ad)}</b><span>${e([k.model, sayi(k.miktar) + " " + k.birim].filter(Boolean).join(" · "))}${k.ozellikler && k.ozellikler.length ? " · " + e(k.ozellikler.join(", ")) : ""}</span></span>
        <span class="k2">${para(k.tutar, d)}</span></li>`).join("");
      return `<li class="sis"><span class="ik">${ikon(st.ikon, 16, "#E5341B")}</span>
        <span style="flex:1; min-width:0"><span class="ad"><span>${e(st.ad)}</span><span>${para(st.tutar, d)}</span></span>
        <div class="ks">${e(st.kapsam || "")}${st.kapsam ? "; " : ""}${(st.kalemler || []).length} kalem</div></span></li>
        <ul class="liste kalemler gizli" data-grup="${i}">${kalemler}</ul>`;
    }).join("");
    const kalemSayisi = (v.sistemler || []).reduce((a, s) => a + (s.kalemler || []).length, 0);

    const gruplar = {};
    (v.uyarilar || []).forEach(u => (gruplar[u.kategori] = gruplar[u.kategori] || []).push(u.metin));
    const beklenen = (v.sartlar || []).filter(t => t.tur === "beklenen");
    const haric = (v.sartlar || []).filter(t => t.tur === "haric");
    const sartlar = (v.sartlar || []).filter(t => t.tur === "sart");
    const ilkUyari = (v.uyarilar || [])[0];
    const uyariVar = (v.uyarilar || []).length + beklenen.length + haric.length > 0;
    const uyariDetay = Object.entries(gruplar).map(([k, l]) =>
        `<div class="uy-k">${ikon("uyari", 14, "#B25000", 1.8)}${e(k)}</div>${l.map(m => `<div class="madde">${e(m)}</div>`).join("")}`).join("")
      + (beklenen.length ? `<div class="alt-b">Müşteriden Beklenenler</div>${beklenen.map(t => `<div class="madde">${e(t.metin)}</div>`).join("")}` : "")
      + (haric.length ? `<div class="alt-b">Kapsam Dışı</div>${haric.map(t => `<div class="madde">${e(t.metin)}</div>`).join("")}` : "");

    const sartHtml = sartlar.map(t => `<div class="madde"><b style="font-weight:600">${e(t.baslik)}</b>${t.baslik ? " · " : ""}${e(t.metin)}</div>`).join("");

    sayfa.innerHTML = `
      <div style="display:flex; flex-direction:column; gap:6px">
        <span class="kas">${e(musteri)} için teklif</span>
        <h1>${e(v.konu)}</h1>
        <span class="meta">${e(v.no)} · Revizyon ${e(v.revizyon)}${v.hazirlayan ? " · Hazırlayan " + e(v.hazirlayan) : ""}</span>
      </div>
      <section class="kart ic">
        <div style="display:flex; align-items:baseline"><span class="meta">Genel Toplam · KDV dahil</span><span class="sure">${e(sure)}</span></div>
        <span class="toplam">${para(v.genel_toplam, d)}</span>
        <div style="display:flex; flex-direction:column; gap:4px">
          <div class="satir"><span>Ara Toplam</span><span>${para(v.ara_toplam, d)}</span></div>
          ${v.iskonto_orani > 0 ? `<div class="satir"><span>İskonto %${sayi(v.iskonto_orani)}</span><span>−${para(iskonto, d)}</span></div>` : ""}
          <div class="satir"><span>KDV %${sayi(v.kdv_orani)}</span><span>${para(kdv, d)}</span></div>
        </div>
        ${v.odeme ? `<span class="meta">Ödeme: ${e(v.odeme)}</span>` : ""}
        ${v.gecerlilik ? `<span class="meta">Geçerlilik: ${tarih(v.gecerlilik)}</span>` : ""}
      </section>
      ${v.ozet ? `<p class="ozet">${e(v.ozet)}</p>` : ""}
      ${v.musteri_notu ? `<p class="ozet" style="color:var(--metin2)">${e(v.musteri_notu)}</p>` : ""}
      <section class="kart" style="padding:4px 16px">
        <h2 style="margin:12px 0 8px">Kapsam</h2>
        <ul class="liste">${sistemler}</ul>
        <button type="button" class="bag" id="kalemAc">${kalemSayisi} kalemin tamamını göster</button>
      </section>
      ${uyariVar ? `<section class="kart ic">
        <h2 style="display:flex; align-items:center; gap:6px">${ikon("uyari", 16, "#B25000", 1.8)}Uyarılar ve Kapsam Dışı</h2>
        <div id="uyariOzet">${ilkUyari ? `<div class="madde" style="padding:0">${e(ilkUyari.metin)}</div>` : ""}
          <button type="button" class="bag" style="border:0; padding:6px 0 0" id="uyariAc">${(v.uyarilar || []).length} uyarı, ${haric.length} kapsam dışı madde · Tümü</button></div>
        <div id="uyariTum" class="gizli gizli-yazdir-ac">${uyariDetay}</div>
      </section>` : ""}
      ${sartlar.length ? `<section class="kart ic"><h2>Teklif Şartları</h2>${sartHtml}</section>` : ""}
      ${v.durum === "sent" && !v.suresi_doldu ? formHtml() : v.suresi_doldu ? `<section class="kart ic"><h2>Teklifin süresi doldu</h2><span class="meta">Güncel teklif için ${e(v.hazirlayan || "bizimle")} iletişime geçin.</span></section>` : ""}
      ${iletisim(v)}`;

    const kalemAc = document.getElementById("kalemAc");
    kalemAc && kalemAc.addEventListener("click", () => {
      const acik = kalemAc.dataset.acik === "1";
      document.querySelectorAll(".kalemler").forEach(x => x.classList.toggle("gizli", acik));
      kalemAc.dataset.acik = acik ? "0" : "1";
      kalemAc.textContent = acik ? `${kalemSayisi} kalemin tamamını göster` : "Kalemleri gizle";
    });
    const uyariAc = document.getElementById("uyariAc");
    uyariAc && uyariAc.addEventListener("click", () => {
      document.getElementById("uyariOzet").classList.add("gizli");
      document.getElementById("uyariTum").classList.remove("gizli");
    });
    if (v.durum === "sent" && !v.suresi_doldu) formBagla(v);
  }

  const formHtml = () => `
    <section class="kart ic" id="onayKarti" style="gap:12px">
      <h2 id="formBaslik">Teklifi Onaylayın</h2>
      <label class="alan"><span>Ad Soyad</span><input type="text" id="ad" autocomplete="name" maxlength="120"></label>
      <label class="alan"><span>Unvan</span><input type="text" id="unvan" autocomplete="organization-title" maxlength="120"></label>
      <label class="alan" id="sipAlan"><span>Sipariş No <i>· isteğe bağlı</i></span><input type="text" id="sip" maxlength="60"></label>
      <label class="alan gizli" id="notAlan"><span id="notEtiket">Revizyon isteğiniz</span><textarea id="not" maxlength="2000"></textarea></label>
      <label class="kutu" id="kabulAlan"><input type="checkbox" id="kabul"><span>Teklifteki kapsam, uyarılar ve şartları okudum, kabul ediyorum.</span></label>
      <div class="hata gizli" id="hata" role="alert"></div>
      <button type="button" class="d-ana" id="gonder">Teklifi Kabul Et</button>
      <div class="ikili" id="ikili">
        <button type="button" class="d-ikincil" id="revBtn">Revizyon İste</button>
        <button type="button" class="d-ret" id="retBtn">Reddet</button>
      </div>
      <button type="button" class="bag gizli" id="geriBtn" style="border:0; padding:0; text-align:center">Vazgeç, teklifi kabul etmeye dön</button>
      <span class="dip">Yanıtınız adınız, tarih ve IP adresiyle kayıt altına alınır ve teklifi gönderen firmaya bildirilir.</span>
    </section>`;

  function formBagla(v) {
    let tur = "accepted";
    const $ = id => document.getElementById(id);
    const gonder = $("gonder"), hata = $("hata");
    const kur = t => {
      tur = t;
      $("formBaslik").textContent = t === "accepted" ? "Teklifi Onaylayın" : t === "revision" ? "Revizyon İsteyin" : "Teklifi Reddedin";
      $("sipAlan").classList.toggle("gizli", t !== "accepted");
      $("kabulAlan").classList.toggle("gizli", t !== "accepted");
      $("notAlan").classList.toggle("gizli", t === "accepted");
      $("notEtiket").innerHTML = t === "revision" ? "Revizyon isteğiniz" : "Ret nedeni <i>· isteğe bağlı</i>";
      $("ikili").classList.toggle("gizli", t !== "accepted");
      $("geriBtn").classList.toggle("gizli", t === "accepted");
      gonder.className = "d-ana" + (t === "revision" ? " mavi" : t === "rejected" ? " kirmizi" : "");
      gonder.textContent = t === "accepted" ? "Teklifi Kabul Et" : t === "revision" ? "Revizyon İsteğini Gönder" : "Teklifi Reddet";
      hata.classList.add("gizli");
      if (t !== "accepted") $("not").focus();
    };
    $("revBtn").addEventListener("click", () => kur("revision"));
    $("retBtn").addEventListener("click", () => kur("rejected"));
    $("geriBtn").addEventListener("click", () => kur("accepted"));
    gonder.addEventListener("click", async () => {
      const govde = { tur, ad: $("ad").value, unvan: $("unvan").value, siparis_no: $("sip").value, not: $("not").value, kabul: $("kabul").checked };
      if (govde.ad.trim().length < 3) return goster("Adınızı ve soyadınızı yazın.");
      if (tur === "accepted" && !govde.kabul) return goster("Kabul için şartları okuduğunuzu işaretleyin.");
      if (tur === "revision" && !govde.not.trim()) return goster("Revizyon isteğinizi yazın.");
      gonder.disabled = true; const eski = gonder.textContent; gonder.textContent = "Gönderiliyor…";
      try {
        const r = await rpc("teklif_online_yanit", { p_kod: kod, p: govde });
        window.scrollTo(0, 0);
        sonucEkrani(v, { tur, zaman: r.zaman, ad: govde.ad.trim(), unvan: govde.unvan.trim() });
      } catch (err) {
        gonder.disabled = false; gonder.textContent = eski; goster(err.message);
      }
    });
    function goster(m) { hata.textContent = m; hata.classList.remove("gizli"); }
  }

  document.getElementById("yazdir").addEventListener("click", () => {
    document.querySelectorAll(".kalemler").forEach(x => x.classList.remove("gizli"));
    window.print();
  });

  if (!kod) return hataGoster("Bağlantıda teklif kodu yok.");
  rpc("teklif_online", { p_kod: kod }).then(ciz).catch(err => hataGoster(err.message));
})();
</script>
</body>
</html>
