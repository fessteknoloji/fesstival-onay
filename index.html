<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0F2340">
<title>Teklif</title>
<style>
  /* Tasarım: Teklif Onay · 1 Belge (lacivert zemin, ortada kâğıt, yanda karar) */
  :root {
    --lac: #0F2340; --kart: #FFFFFF; --cizgi: #E5E8EE; --cizgi2: #EEF0F4; --girdi: #D9DEE6;
    --metin: #1D2433; --metin2: #3A4558; --ikincil: #6B7686; --soluk: #B8C4D6; --soluk2: #8D9CB2; --mavi: #1F6FD1;
    --yesil: #15803D; --kirmizi: #D70015; --marka: #E5341B; --turuncu: #B25000; --sari: #F5A524;
  }
  * { box-sizing: border-box; }
  html { background: var(--lac); }
  body { margin: 0; min-height: 100vh; color: var(--metin);
    background: linear-gradient(160deg, #13294A 0%, var(--lac) 55%, #0A1A31 100%) fixed;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
  a { color: var(--mavi); text-decoration: none; }
  button { font: inherit; cursor: pointer; }
  .gizli { display: none !important; }
  .v { position: fixed; left: 48%; top: -220px; width: 1100px; height: 1100px; fill: #fff; opacity: .05; pointer-events: none; z-index: 0; }

  /* Yerleşim */
  .duzen { position: relative; z-index: 1; max-width: 960px; margin: 0 auto; padding: 16px 12px 150px; display: flex; gap: 44px; align-items: flex-start; }
  .yan { display: none; }

  /* Kâğıt */
  .kagit { flex: 1; min-width: 0; background: #fff; border-radius: 8px; box-shadow: 0 30px 80px rgba(0,0,0,.4); padding: 22px 20px 28px; }
  .antet { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .firma { display: flex; align-items: center; font-size: 16px; font-weight: 700; letter-spacing: -.01em; min-height: 30px; }
  .firma img { height: 34px; width: auto; max-width: 170px; object-fit: contain; display: block; }
  .no { text-align: right; font-size: 10.5px; color: var(--ikincil); line-height: 1.6; white-space: nowrap; }
  .no b { color: var(--metin); font-size: 12px; }
  .cizgi { height: 3px; background: linear-gradient(90deg, var(--marka) 0 56px, var(--lac) 56px); margin: 16px 0 20px; }
  .sayin { font-size: 11.5px; color: var(--ikincil); }
  h1 { margin: 4px 0 0; font-size: 22px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
  .ozet { margin: 12px 0 0; font-size: 13.5px; line-height: 1.6; color: var(--metin2); }
  table.kalem { width: 100%; border-collapse: collapse; margin-top: 18px; font-size: 12px; }
  table.kalem td { padding: 5px 0; vertical-align: top; }
  table.kalem .sis td { padding: 14px 0 6px; font-size: 13.5px; font-weight: 650; border-top: 1px solid var(--cizgi); }
  table.kalem .sis .ad { display: inline-flex; gap: 8px; align-items: center; }
  table.kalem .sis .ks { display: block; font-size: 11.5px; font-weight: 400; color: var(--ikincil); margin: 2px 0 0 23px; }
  table.kalem .k1 { padding-left: 23px; }
  table.kalem .k1 span { display: block; font-size: 11px; color: var(--ikincil); line-height: 1.4; }
  table.kalem .mk { text-align: right; color: var(--ikincil); white-space: nowrap; padding-left: 10px; }
  table.kalem .tt { text-align: right; white-space: nowrap; padding-left: 12px; }
  table.kalem .sis .tt { font-weight: 650; }
  table.toplam { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 12.5px; }
  table.toplam td { padding: 4px 0; color: var(--ikincil); }
  table.toplam td:last-child { text-align: right; color: var(--metin); }
  table.toplam .gt td { padding-top: 12px; border-top: 2px solid var(--metin); font-size: 14px; font-weight: 700; color: var(--metin); }
  table.toplam .gt td:last-child { font-size: 20px; letter-spacing: -.02em; }
  .bolum { margin-top: 22px; }
  .bolum h2 { margin: 0 0 6px; font-size: 13px; font-weight: 700; }
  .not { font-size: 12px; line-height: 1.6; color: var(--metin2); border-left: 3px solid var(--marka); padding: 1px 0 1px 12px; }
  .not div + div { margin-top: 4px; }
  .not .alt-b { font-weight: 650; color: var(--ikincil); margin-top: 8px; }
  .sart { font-size: 12px; line-height: 1.6; color: var(--metin2); }

  /* Karar (bilgisayarda sağda, telefonda altta) */
  .ust-k { font-size: 12px; color: var(--soluk); }
  .tutar { font-size: 32px; font-weight: 700; letter-spacing: -.02em; color: #fff; margin-top: 2px; }
  .sure { font-size: 12.5px; font-weight: 600; color: var(--sari); }
  .sure.bitti { color: #F97066; }
  .d-beyaz { height: 50px; border: 0; border-radius: 25px; background: #fff; color: var(--lac); font-size: 15px; font-weight: 650; width: 100%; }
  .d-cam { height: 44px; border-radius: 22px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.16); color: #fff; font-size: 14px; font-weight: 600; width: 100%; }
  .d-yazi { border: 0; background: none; color: #F97066; font-size: 13.5px; font-weight: 600; padding: 6px; }
  .d-pdf { display: inline-flex; align-items: center; gap: 7px; border: 0; background: none; color: var(--soluk); font-size: 13px; padding: 4px 0; }
  .d-pdf:hover { color: #fff; }
  .imza { display: flex; gap: 12px; align-items: center; }
  .av { width: 42px; height: 42px; border-radius: 21px; flex: none; overflow: hidden; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(140deg, #2A4A7A, #18345C); border: 1.5px solid rgba(255,255,255,.18); color: #fff; font-size: 14px; font-weight: 650; }
  .av img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .imza .ad { font-size: 13.5px; font-weight: 650; color: #fff; }
  .imza .sat { font-size: 12px; color: var(--soluk2); line-height: 1.5; }
  .imza .sat a { color: var(--soluk2); }
  .bitti-k { font-size: 13.5px; line-height: 1.5; color: var(--soluk); }

  .alt { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; padding: 12px 16px calc(16px + env(safe-area-inset-bottom));
    background: rgba(8,20,40,.94); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); color: #fff; display: flex; flex-direction: column; gap: 10px; }
  .alt .ust { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .alt .tutar { font-size: 22px; margin: 0; }
  .alt .sira { display: flex; gap: 8px; }
  .alt .daha { width: 50px; height: 50px; flex: none; border-radius: 25px; border: 1px solid rgba(255,255,255,.2); background: none; color: #fff; display: flex; align-items: center; justify-content: center; }
  .menu { position: absolute; right: 16px; bottom: calc(100% + 8px); background: #fff; border-radius: 14px; box-shadow: 0 14px 40px rgba(0,0,0,.35); overflow: hidden; min-width: 210px; }
  .menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 13px 16px; font-size: 15px; color: var(--metin); border-top: 1px solid var(--cizgi2); }
  .menu button:first-child { border-top: 0; }
  .menu .kirmizi { color: var(--kirmizi); }

  /* Karar penceresi (form) */
  .perde { position: fixed; inset: 0; z-index: 10; background: rgba(5,12,24,.55); display: flex; align-items: flex-end; justify-content: center; }
  .pencere { width: 100%; max-width: 440px; background: #fff; border-radius: 22px 22px 0 0; padding: 22px 20px calc(22px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 12px; max-height: 92vh; overflow: auto; }
  .pencere .bas { display: flex; align-items: center; justify-content: space-between; }
  .pencere h2 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -.01em; }
  .kapat { width: 32px; height: 32px; border-radius: 16px; border: 0; background: #EEF1F5; color: var(--ikincil); display: flex; align-items: center; justify-content: center; }
  label.alan { display: flex; flex-direction: column; gap: 6px; }
  label.alan span { font-size: 12.5px; font-weight: 600; color: var(--metin2); }
  label.alan span i { font-style: normal; font-weight: 400; color: var(--ikincil); }
  input[type=text], textarea { width: 100%; height: 46px; padding: 0 13px; border: 1px solid var(--girdi); border-radius: 12px;
    font: inherit; font-size: 16px; color: var(--metin); background: #fff; outline: none; }
  textarea { height: 104px; padding: 11px 13px; resize: vertical; line-height: 1.45; }
  input[type=text]:focus, textarea:focus { border-color: var(--mavi); box-shadow: 0 0 0 4px rgba(31,111,209,.14); }
  .kutu { display: flex; gap: 10px; font-size: 13.5px; line-height: 1.45; color: var(--metin2); align-items: flex-start; cursor: pointer; }
  .kutu input { width: 20px; height: 20px; margin: 0; accent-color: var(--lac); flex: none; }
  .d-ana { height: 50px; border: 0; border-radius: 25px; background: var(--lac); color: #fff; font-size: 15.5px; font-weight: 650; width: 100%; }
  .d-ana.kirmizi { background: var(--kirmizi); }
  .d-ana:disabled { opacity: .45; cursor: default; }
  .dip { font-size: 11.5px; color: var(--ikincil); line-height: 1.45; }
  .hata { font-size: 13px; color: var(--kirmizi); }

  /* Sonuç ve hata */
  .sonuc { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding: 24px 14px 48px; }
  .sonuc .ust-s { color: #fff; padding: 4px 4px 22px; }
  .sonuc .kagit { padding: 30px 24px 26px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; }
  .yuv { width: 76px; height: 76px; border-radius: 38px; display: flex; align-items: center; justify-content: center; }
  .sonuc h1 { margin: 8px 0 0; font-size: 24px; }
  .sonuc p { margin: 0; font-size: 13.5px; line-height: 1.55; color: var(--ikincil); }
  .adimlar { width: 100%; text-align: left; border-top: 1px solid var(--cizgi); margin-top: 14px; padding-top: 16px; display: flex; flex-direction: column; gap: 12px; }
  .adimlar .baslik { font-size: 12.5px; font-weight: 650; color: var(--ikincil); }
  .adim { display: flex; gap: 12px; align-items: flex-start; font-size: 14px; line-height: 1.5; }
  .adim span { width: 24px; height: 24px; border-radius: 12px; background: #EEF1F5; color: var(--ikincil); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none; }
  .adim:first-of-type span { background: var(--lac); color: #fff; }
  .sonuc .imza { margin-top: 20px; padding: 0 4px; }
  .bekle { position: relative; z-index: 1; padding: 120px 0; text-align: center; color: var(--soluk); font-size: 15px; }

  @media (min-width: 960px) {
    .duzen { padding: 40px 32px 60px; }
    .kagit { padding: 44px 48px 48px; border-radius: 6px; }
    .firma { font-size: 18px; }
    .no { font-size: 11.5px; }
    .no b { font-size: 13px; }
    .cizgi { margin: 22px 0 26px; background: linear-gradient(90deg, var(--marka) 0 70px, var(--lac) 70px); }
    .sayin { font-size: 12px; }
    h1 { font-size: 28px; letter-spacing: -.025em; }
    table.kalem { font-size: 13px; }
    table.kalem .sis td { font-size: 14px; }
    table.toplam { font-size: 13px; }
    table.toplam .gt td { font-size: 15px; }
    table.toplam .gt td:last-child { font-size: 22px; }
    .yan { display: flex; flex-direction: column; gap: 14px; width: 276px; flex: none; position: sticky; top: 40px; color: #fff; }
    .yan .d-yazi { align-self: center; }
    .yan hr { border: 0; height: 1px; background: rgba(255,255,255,.12); margin: 6px 0; width: 100%; }
    .alt { display: none; }
    .perde { align-items: center; }
    .pencere { border-radius: 22px; padding: 24px 24px 22px; }
    .sonuc { padding-top: 40px; }
    .sonuc .kagit { padding: 40px 40px 34px; }
    .sonuc h1 { font-size: 28px; }
  }
  @media print {
    html, body { background: #fff !important; }
    .v, .yan, .alt, .perde { display: none !important; }
    .duzen { padding: 0; display: block; }
    .kagit { box-shadow: none; padding: 0; }
  }
</style>
</head>
<body>
<svg class="v" viewBox="0 0 1000 1000" aria-hidden="true"><polygon points="322.5,865.5 518.9,865.5 774.0,120.0 591.3,120.0 424.4,668.1"/><polygon points="322.5,865.5 424.4,668.1 342.4,399.3 182.2,453.9"/></svg>
<div id="sayfa"><div class="bekle">Teklif yükleniyor…</div></div>

<script>
(() => {
  const SUPABASE = "https://igisxxlsixjeplirxtsp.supabase.co";
  // Yayınlanabilir anahtar: yalnızca kodla erişilen iki fonksiyonu çağırabilir.
  const ANAHTAR = "sb_publishable_9-t40KkzUznQNXw0RWRU8g_3_lvnhE3";

  const kod = (() => {
    const q = new URLSearchParams(location.search).get("t");
    if (q) return q;
    const m = location.pathname.match(/\/t\/([A-Za-z0-9-]{6,})/);
    if (m) return m[1];
    return location.hash.replace(/^#/, "") || "";
  })().toUpperCase();

  const sayfa = document.getElementById("sayfa");
  const $ = id => document.getElementById(id);
  const e = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const b64 = s => typeof s === "string" && /^[A-Za-z0-9+/]+=*$/.test(s) && s.length > 20;

  async function rpc(ad, govde) {
    const r = await fetch(`${SUPABASE}/rest/v1/rpc/${ad}`, {
      method: "POST",
      headers: { "apikey": ANAHTAR, "Content-Type": "application/json" },
      body: JSON.stringify(govde)
    });
    const j = await r.json().catch(() => null);
    if (!r.ok) throw new Error((j && j.message) || "Bağlantı kurulamadı. Lütfen tekrar deneyin.");
    return j;
  }

  const para = (v, d) => {
    try { return new Intl.NumberFormat("tr-TR", { style: "currency", currency: d === "TRY" ? "TRY" : d, minimumFractionDigits: 2 }).format(v); }
    catch { return Number(v).toLocaleString("tr-TR", { minimumFractionDigits: 2 }) + " " + d; }
  };
  const tarih = iso => {
    if (!iso) return "";
    const [y, a, g] = iso.slice(0, 10).split("-").map(Number);
    return new Date(y, a - 1, g).toLocaleDateString("tr-TR", { day: "numeric", month: "long", year: "numeric" });
  };
  const sayi = v => Number(v).toLocaleString("tr-TR", { maximumFractionDigits: 2 });
  const basHarf = ad => String(ad || "").trim().split(/\s+/).slice(0, 2).map(x => x[0] || "").join("").toLocaleUpperCase("tr-TR");

  const IKON = {
    alev: '<path d="M12 3c3 4 6 6 6 11a6 6 0 0 1-12 0c0-3 2-5 3-7 1 2 2 3 3 3 0-3-1-5 0-7z"/>',
    proje: '<path d="M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6"/>',
    servis: '<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/>',
    kamera: '<path d="M3 7h13v10H3zM16 10l5-3v10l-5-3"/>',
    kilit: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
    ses: '<path d="M4 10v4h4l5 4V6L8 10z"/><path d="M16 9a4 4 0 0 1 0 6"/>',
    kutu: '<path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/>',
    uyari: '<path d="M12 4 2 20h20z"/><path d="M12 10v4M12 17v.5"/>',
    onay: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
    geri: '<path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>',
    kapat: '<path d="M6 6l12 12M18 6 6 18"/>',
    indir: '<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
    daha: '<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>'
  };
  const ikon = (ad, boy, renk, kal = 1.7) =>
    `<svg width="${boy}" height="${boy}" viewBox="0 0 24 24" fill="none" stroke="${renk}" stroke-width="${kal}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IKON[ad] || IKON.kutu}</svg>`;

  const firmaHtml = v => {
    const s = (v && v.sirket) || {};
    const ad = s.kisa || s.unvan || "";
    return b64(s.logo) ? `<img src="data:image/png;base64,${s.logo}" alt="${e(ad)}">` : e(ad);
  };

  function imza(v) {
    const s = v.sirket || {};
    const ad = v.hazirlayan || "";
    if (!ad) return "";
    const av = b64(v.hazirlayan_foto) ? `<img src="data:image/jpeg;base64,${v.hazirlayan_foto}" alt="">` : e(basHarf(ad));
    const unvan = [v.hazirlayan_unvan, s.kisa || s.unvan].filter(Boolean).map(e).join(" · ");
    const iletisim = [
      v.hazirlayan_telefon ? `<a href="tel:${e(String(v.hazirlayan_telefon).replace(/\s/g, ""))}">${e(v.hazirlayan_telefon)}</a>` : "",
      v.hazirlayan_eposta ? `<a href="mailto:${e(v.hazirlayan_eposta)}">${e(v.hazirlayan_eposta)}</a>` : ""
    ].filter(Boolean).join(" · ");
    return `<div class="imza"><span class="av">${av}</span><span style="display:flex; flex-direction:column; min-width:0">
      <span class="ad">${e(ad)}</span>${unvan ? `<span class="sat">${unvan}</span>` : ""}${iletisim ? `<span class="sat">${iletisim}</span>` : ""}</span></div>`;
  }

  function hataGoster(mesaj) {
    sayfa.innerHTML = `<div class="sonuc"><div class="kagit">
      <span class="yuv" style="background:#F2F3F5">${ikon("uyari", 34, "#6B7686", 1.8)}</span>
      <h1>Teklif açılamadı</h1><p>${e(mesaj)}</p>
      <p>Bağlantıyı e-postadaki düğmeden açtığınızdan emin olun veya teklifi gönderen kişiyle iletişime geçin.</p></div></div>`;
  }

  function sonucEkrani(v, y) {
    const tur = y.tur;
    const r = tur === "accepted" ? ["onay", "#15803D", "#E5F1EA", "Teklifi onayladınız"]
            : tur === "rejected" ? ["kapat", "#D70015", "#FDECEA", "Teklifi reddettiniz"]
            : ["geri", "#1F6FD1", "#E8F1FB", "Revizyon isteğiniz iletildi"];
    const kim = e(v.hazirlayan || "Teklifi hazırlayan kişi");
    const adimlar = tur === "accepted"
      ? [`${kim} siparişi oluşturur.`, "Keşif ve montaj tarihi için sizinle iletişime geçer.", "Montaj sonrası servis formu imzanıza gelir."]
      : tur === "revision" ? [`${kim} isteğinizi inceler.`, "Revize teklif size yeni bir bağlantıyla iletilir."] : [];
    const kisi = [y.ad, y.unvan].filter(Boolean).map(e).join(", ");
    sayfa.innerHTML = `<div class="sonuc">
      <div class="ust-s"><span class="firma" style="color:#fff">${e((v.sirket || {}).kisa || (v.sirket || {}).unvan || "")}</span></div>
      <div class="kagit">
        <span class="yuv" style="background:${r[2]}">${ikon(r[0], 36, r[1], 2.4)}</span>
        <h1>${r[3]}</h1>
        <p>${e(v.no)} · ${e(v.konu)}<br>${e(y.zaman || "")}${kisi ? " · " + kisi : ""}</p>
        ${adimlar.length
          ? `<div class="adimlar"><span class="baslik">Sırada ne var?</span>${adimlar.map((a, i) => `<div class="adim"><span>${i + 1}</span>${a}</div>`).join("")}</div>`
          : `<p style="margin-top:8px; color:var(--metin2)">Geri bildiriminiz için teşekkür ederiz. Yeni bir ihtiyacınız olduğunda bize her zaman ulaşabilirsiniz.</p>`}
      </div>
      ${imza(v)}</div>`;
  }

  function ciz(v) {
    document.title = `${v.no} · ${v.konu}`;
    if (v.yanit && v.durum !== "sent") return sonucEkrani(v, v.yanit);

    const d = v.doviz;
    const iskonto = Math.round(v.ara_toplam * v.iskonto_orani) / 100;
    const kdv = v.genel_toplam - (v.ara_toplam - iskonto);
    const m = v.musteri || {};
    const sayin = m.kisi || m.unvan || m.ad || "";
    const sure = v.suresi_doldu ? "Süresi doldu" : [v.kalan_gun != null ? `${v.kalan_gun} gün geçerli` : "", v.gecerlilik ? tarih(v.gecerlilik) : ""].filter(Boolean).join(" · ");
    const acik = v.durum === "sent" && !v.suresi_doldu;

    const satirlar = (v.sistemler || []).map(st => {
      const n = (st.kalemler || []).length;
      const ks = [st.kapsam, `${n} kalem`].filter(Boolean).map(e).join(" · ");
      return `<tr class="sis"><td colspan="3"><span class="ad">${ikon(st.ikon, 15, "#E5341B", 1.8)}${e(st.ad)}</span><span class="ks">${ks}</span></td><td class="tt">${para(st.tutar, d)}</td></tr>`
        + (st.kalemler || []).map(k => `<tr><td class="k1">${e(k.ad)}<span>${e([k.model, (k.ozellikler || []).join(", ")].filter(Boolean).join(" · "))}</span></td><td></td>
            <td class="mk">${sayi(k.miktar)} ${e(k.birim)}</td><td class="tt">${para(k.tutar, d)}</td></tr>`).join("");
    }).join("");

    const beklenen = (v.sartlar || []).filter(t => t.tur === "beklenen");
    const haric = (v.sartlar || []).filter(t => t.tur === "haric");
    const sartlar = (v.sartlar || []).filter(t => t.tur === "sart");
    const uyarilar = (v.uyarilar || []).map(u => `<div>${e(u.metin)}</div>`).join("")
      + (beklenen.length ? `<div class="alt-b">Müşteriden Beklenenler</div>${beklenen.map(t => `<div>${e(t.metin)}</div>`).join("")}` : "")
      + (haric.length ? `<div class="alt-b">Kapsam Dışı</div>${haric.map(t => `<div>${e(t.metin)}</div>`).join("")}` : "");
    const sartHtml = (v.odeme ? `<div>Ödeme: ${e(v.odeme)}</div>` : "")
      + sartlar.map(t => `<div>${t.baslik ? `<b style="font-weight:600">${e(t.baslik)}</b> · ` : ""}${e(t.metin)}</div>`).join("")
      + (v.gecerlilik ? `<div>Geçerlilik: ${tarih(v.gecerlilik)}</div>` : "");

    const kararDugmeleri = acik ? `
        <button type="button" class="d-beyaz" data-tur="accepted">Teklifi Kabul Et</button>
        <button type="button" class="d-cam" data-tur="revision">Revizyon İste</button>
        <button type="button" class="d-yazi" data-tur="rejected">Reddet</button>`
      : v.suresi_doldu ? `<span class="bitti-k">Teklifin süresi doldu. Güncel teklif için ${e(v.hazirlayan || "bizimle")} iletişime geçin.</span>` : "";

    sayfa.innerHTML = `<div class="duzen">
      <article class="kagit">
        <div class="antet"><span class="firma">${firmaHtml(v)}</span>
          <span class="no">Teklif No<br><b>${e(v.no)}</b><br>${[v.tarih ? tarih(v.tarih) : "", v.revizyon ? `Rev. ${e(v.revizyon)}` : ""].filter(Boolean).join(" · ")}</span></div>
        <div class="cizgi"></div>
        ${sayin ? `<div class="sayin">Sayın ${e(sayin)}</div>` : ""}
        <h1>${e(v.konu)}</h1>
        ${v.ozet ? `<p class="ozet">${e(v.ozet)}</p>` : ""}
        ${v.musteri_notu ? `<p class="ozet">${e(v.musteri_notu)}</p>` : ""}
        <table class="kalem">${satirlar}</table>
        <table class="toplam">
          <tr><td>Ara Toplam</td><td>${para(v.ara_toplam, d)}</td></tr>
          ${v.iskonto_orani > 0 ? `<tr><td>İskonto %${sayi(v.iskonto_orani)}</td><td>−${para(iskonto, d)}</td></tr>` : ""}
          <tr><td>KDV %${sayi(v.kdv_orani)}</td><td>${para(kdv, d)}</td></tr>
          <tr class="gt"><td>Genel Toplam</td><td>${para(v.genel_toplam, d)}</td></tr>
        </table>
        ${uyarilar ? `<div class="bolum"><h2>Uyarılar ve Kapsam Dışı</h2><div class="not">${uyarilar}</div></div>` : ""}
        ${sartHtml ? `<div class="bolum"><h2>Şartlar</h2><div class="sart">${sartHtml}</div></div>` : ""}
      </article>
      <aside class="yan">
        <span class="ust-k">Bu teklif sizin için hazırlandı</span>
        <div><div class="tutar">${para(v.genel_toplam, d)}</div><div class="sure${v.suresi_doldu ? " bitti" : ""}">${e(sure)}</div></div>
        ${kararDugmeleri}
        <hr>${imza(v)}
        <button type="button" class="d-pdf" data-pdf>${ikon("indir", 15, "currentColor", 1.8)}PDF olarak indir</button>
      </aside>
    </div>
    <div class="alt">
      <div class="ust"><span class="tutar">${para(v.genel_toplam, d)}</span><span class="sure${v.suresi_doldu ? " bitti" : ""}">${e(v.suresi_doldu ? "Süresi doldu" : (v.kalan_gun != null ? `${v.kalan_gun} gün geçerli` : ""))}</span></div>
      <div class="sira">
        ${acik ? `<button type="button" class="d-beyaz" data-tur="accepted">Teklifi Kabul Et</button>` : `<span class="bitti-k" style="flex:1; align-self:center">${v.suresi_doldu ? "Teklifin süresi doldu." : ""}</span>`}
        <button type="button" class="daha" id="dahaBtn" aria-label="Diğer seçenekler">${ikon("daha", 20, "#fff", 2.4)}</button>
      </div>
      <div class="menu gizli" id="menu">
        ${acik ? `<button type="button" data-tur="revision">Revizyon İste</button>` : ""}
        <button type="button" data-pdf>PDF olarak indir</button>
        ${v.hazirlayan_telefon ? `<button type="button" data-ara>${e(v.hazirlayan || "Hazırlayanı")} Ara</button>` : ""}
        ${acik ? `<button type="button" class="kirmizi" data-tur="rejected">Reddet</button>` : ""}
      </div>
    </div>`;

    document.querySelectorAll("[data-tur]").forEach(b => b.addEventListener("click", () => { $("menu").classList.add("gizli"); pencereAc(v, b.dataset.tur); }));
    document.querySelectorAll("[data-pdf]").forEach(b => b.addEventListener("click", () => { $("menu").classList.add("gizli"); window.print(); }));
    const ara = document.querySelector("[data-ara]");
    ara && ara.addEventListener("click", () => { location.href = "tel:" + String(v.hazirlayan_telefon).replace(/\s/g, ""); });
    $("dahaBtn").addEventListener("click", ev => { ev.stopPropagation(); $("menu").classList.toggle("gizli"); });
    document.addEventListener("click", ev => { if (!ev.target.closest("#menu")) $("menu").classList.add("gizli"); });
  }

  // Karar penceresi: kabul / revizyon / ret
  function pencereAc(v, tur) {
    const eski = $("perde"); if (eski) eski.remove();
    const baslik = tur === "accepted" ? "Teklifi Kabul Edin" : tur === "revision" ? "Revizyon İsteyin" : "Teklifi Reddedin";
    const dugme = tur === "accepted" ? "Teklifi Kabul Et" : tur === "revision" ? "Revizyon İsteğini Gönder" : "Teklifi Reddet";
    const el = document.createElement("div");
    el.className = "perde"; el.id = "perde";
    el.innerHTML = `<div class="pencere" role="dialog" aria-modal="true" aria-labelledby="pBaslik">
      <div class="bas"><h2 id="pBaslik">${baslik}</h2><button type="button" class="kapat" id="pKapat" aria-label="Kapat">${ikon("kapat", 16, "currentColor", 2.2)}</button></div>
      <span class="dip" style="font-size:12.5px">${e(v.no)} · ${e(v.konu)} · ${para(v.genel_toplam, v.doviz)}</span>
      <label class="alan"><span>Ad Soyad</span><input type="text" id="ad" autocomplete="name" maxlength="120"></label>
      <label class="alan"><span>Unvan</span><input type="text" id="unvan" autocomplete="organization-title" maxlength="120"></label>
      ${tur === "accepted" ? `<label class="alan"><span>Sipariş No <i>· isteğe bağlı</i></span><input type="text" id="sip" maxlength="60"></label>
        <label class="kutu"><input type="checkbox" id="kabul"><span>Kapsam, uyarılar ve şartları okudum, kabul ediyorum.</span></label>`
        : `<label class="alan"><span>${tur === "revision" ? "Revizyon isteğiniz" : "Ret nedeni <i>· isteğe bağlı</i>"}</span><textarea id="not" maxlength="2000"></textarea></label>`}
      <div class="hata gizli" id="hata" role="alert"></div>
      <button type="button" class="d-ana${tur === "rejected" ? " kirmizi" : ""}" id="gonder">${dugme}</button>
      <span class="dip">Yanıtınız adınız, tarih ve IP adresiyle kayıt altına alınır ve teklifi gönderen firmaya bildirilir.</span>
    </div>`;
    document.body.appendChild(el);
    const kapat = () => el.remove();
    $("pKapat").addEventListener("click", kapat);
    el.addEventListener("click", ev => { if (ev.target === el) kapat(); });
    document.addEventListener("keydown", function esc(ev) { if (ev.key === "Escape") { kapat(); document.removeEventListener("keydown", esc); } });
    $("ad").focus();
    const gonder = $("gonder"), hata = $("hata");
    const goster = m => { hata.textContent = m; hata.classList.remove("gizli"); };
    gonder.addEventListener("click", async () => {
      const deger = id => ($(id) ? $(id).value : "");
      const govde = { tur, ad: deger("ad"), unvan: deger("unvan"), siparis_no: deger("sip"), not: deger("not"), kabul: !!($("kabul") && $("kabul").checked) };
      if (govde.ad.trim().length < 3) return goster("Adınızı ve soyadınızı yazın.");
      if (tur === "accepted" && !govde.kabul) return goster("Kabul için şartları okuduğunuzu işaretleyin.");
      if (tur === "revision" && !govde.not.trim()) return goster("Revizyon isteğinizi yazın.");
      gonder.disabled = true; const eskiYazi = gonder.textContent; gonder.textContent = "Gönderiliyor…";
      try {
        const r = await rpc("teklif_online_yanit", { p_kod: kod, p: govde });
        kapat();
        window.scrollTo(0, 0);
        sonucEkrani(v, { tur, zaman: r.zaman, ad: govde.ad.trim(), unvan: govde.unvan.trim() });
      } catch (err) {
        gonder.disabled = false; gonder.textContent = eskiYazi; goster(err.message);
      }
    });
  }

  if (!kod) return hataGoster("Bağlantıda teklif kodu yok.");
  rpc("teklif_online", { p_kod: kod }).then(ciz).catch(err => hataGoster(err.message));
})();
</script>
</body>
</html>
